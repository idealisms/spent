name: Test

on:
  push:
    paths:
      - 'tracker/**'
      - 'fetch-server/**'
  pull_request:
    paths:
      - 'tracker/**'
      - 'fetch-server/**'

env:
  # puppeteer is a tracker devDependency, so every `yarn install` in this
  # workspace triggers its postinstall Chromium download from
  # storage.googleapis.com — a known source of CI hangs/flakiness, and
  # most jobs (this one included) never even launch a browser. Only
  # test-tracker-e2e actually needs Chrome; it gets one from
  # browser-actions/setup-chrome instead.
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  test-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tracker

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ hashFiles('tracker/yarn.lock') }}

      - run: yarn install --immutable

      - run: yarn test

  test-tracker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tracker

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ hashFiles('tracker/yarn.lock') }}

      - run: yarn install --immutable

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - run: yarn test:e2e
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  test-fetch-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fetch-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - run: pytest
